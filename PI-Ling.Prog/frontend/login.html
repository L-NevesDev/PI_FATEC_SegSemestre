<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabor & Magia — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F5F5F5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: #FFF;
      border: 0.5px solid #E0E0E0;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-icon {
      font-size: 40px;
      display: block;
      margin-bottom: 0.75rem;
    }

    .login-title {
      font-size: 20px;
      font-weight: 600;
      color: #1A1A1A;
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: 13px;
      color: #888;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #555;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 0.5px solid #E0E0E0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.12s;
      font-family: inherit;
    }

    .form-group input:focus { border-color: #1A1A1A; }

    .btn-login {
      width: 100%;
      background: #1A1A1A;
      color: #FFF;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.15s;
      font-family: inherit;
    }

    .btn-login:hover { opacity: 0.85; }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    .erro {
      background: #FEF0EF;
      border: 1px solid #F5B8B3;
      color: #8B1A15;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 1rem;
      display: none;
    }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 11px;
      color: #AAA;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-header">
      <span class="login-icon">🎂</span>
      <div class="login-title">Sabor & Magia</div>
      <div class="login-sub">Sistema de gestão — acesso restrito</div>
    </div>

    <div class="erro" id="erro-login"></div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="seu@email.com" autofocus>
    </div>

    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="login-senha" placeholder="••••••">
    </div>

    <button type="button" class="btn-login" id="btn-login" onclick="fazerLogin()">Entrar</button>

    <div class="login-footer">FATEC Indaiatuba · ADS 2º Período · 2025</div>
  </div>

  <script>
    const API = 'http://localhost:3000/api';

    // Se já tem token válido, vai direto pro sistema
    const token = localStorage.getItem('token');
    if (token) window.location.href = 'index.html';

    // Permite login com Enter
    document.getElementById('login-senha').addEventListener('keydown', e => {
      if (e.key === 'Enter') fazerLogin();
    });

    async function fazerLogin() {
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;
      const erroEl = document.getElementById('erro-login');
      const btn = document.getElementById('btn-login');

      erroEl.style.display = 'none';

      if (!email || !senha) {
        erroEl.textContent = 'Preencha email e senha.';
        erroEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const data = await res.json();

        if (!res.ok) {
          erroEl.textContent = data.erro || 'Credenciais inválidas.';
          erroEl.style.display = 'block';
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('usuario', JSON.stringify(data.funcionario));
        window.location.href = 'index.html';

      } catch {
        erroEl.textContent = 'Erro ao conectar com o servidor.';
        erroEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }
  </script>
</body>
</html>
